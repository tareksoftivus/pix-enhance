<svg viewBox="0 0 620 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric illustration">
    <defs>
        <linearGradient id="ai-face-a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#eaf3ff" />
            <stop offset="1" stop-color="#c9e0ff" />
        </linearGradient>
        <linearGradient id="ai-face-b" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6" />
            <stop offset="1" stop-color="#1d5fd8" />
        </linearGradient>
        <linearGradient id="ai-face-c" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e64d6" />
            <stop offset="1" stop-color="#154aa8" />
        </linearGradient>
        <linearGradient id="ai-screen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#dfecff" />
        </linearGradient>
        <style>
            .ai-float {
                animation: ai-float-move 6s ease-in-out infinite;
                transform-box: view-box;
                transform-origin: center;
                will-change: transform;
            }
            .ai-shadow {
                animation: ai-shadow-scale 6s ease-in-out infinite;
                transform-box: fill-box;
                transform-origin: center;
                will-change: transform;
            }
            @keyframes ai-float-move {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-14px); }
            }
            @keyframes ai-shadow-scale {
                0%, 100% { transform: scale(1); opacity: 0.18; }
                50% { transform: scale(0.93); opacity: 0.14; }
            }
            @media (prefers-reduced-motion: reduce) {
                .ai-float, .ai-shadow { animation: none; }
            }
        </style>
    </defs>

    <ellipse class="ai-shadow" cx="310" cy="500" rx="200" ry="34" fill="#1d5fd8" opacity="0.18" />

    <g transform="translate(536 360)">
        <path d="M0 60 Q-26 24 -6 -6 Q4 22 0 60" fill="#34c38f" />
        <path d="M0 60 Q22 30 8 2 Q-2 26 0 60" fill="#2aa87a" />
