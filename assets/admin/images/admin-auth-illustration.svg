    <path d="M110 470 L110 430 M100 442 L110 430 L120 442" stroke="#1d5fd8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

    <g class="ai-float">
        <g>
            <path d="M250 120 L330 160 L330 300 L250 260 Z" fill="url(#ai-face-c)" />
            <path d="M330 160 L410 120 L410 260 L330 300 Z" fill="url(#ai-face-b)" />
            <path d="M250 120 L330 80 L410 120 L330 160 Z" fill="url(#ai-face-a)" />
            <path d="M268 168 L300 184 M268 190 L300 206 M268 212 L300 228" stroke="#9dc2ff" stroke-width="4" stroke-linecap="round" />
            <path d="M352 172 L388 154 M352 194 L388 176 M352 216 L388 198" stroke="#bcd6ff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
        </g>

        <g>
            <path d="M120 250 L210 295 L210 400 L120 355 Z" fill="url(#ai-face-c)" />
            <path d="M210 295 L300 250 L300 355 L210 400 Z" fill="url(#ai-face-b)" />
            <path d="M120 250 L210 205 L300 250 L210 295 Z" fill="url(#ai-face-a)" />
            <path d="M138 292 L184 315 M138 314 L184 337" stroke="#9dc2ff" stroke-width="4" stroke-linecap="round" />
        </g>

        <g>
            <path d="M330 280 L430 330 L430 400 L330 350 Z" fill="url(#ai-face-c)" />
            <path d="M430 330 L520 285 L520 355 L430 400 Z" fill="url(#ai-face-b)" />
            <path d="M330 280 L420 235 L520 285 L430 330 Z" fill="url(#ai-face-a)" />

            <path d="M392 262 L436 240 L468 256 L424 278 Z" fill="#0f172a" opacity="0.9" />
            <path d="M400 260 L436 242 L460 254 L424 272 Z" fill="url(#ai-screen)" />
            <path d="M418 268 L432 261 M418 272 L436 263" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
        </g>

        <path d="M300 300 L340 320 L340 332 L300 312 Z" fill="#2f74e6" opacity="0.85" />
        <path d="M410 250 L448 231 L448 243 L410 262 Z" fill="#5a93ef" opacity="0.7" />

        <g transform="translate(470 120)">
            <rect x="0" y="0" width="60" height="76" rx="6" fill="#ffffff" transform="skewY(-8)" />
            <path d="M12 20 H48 M12 34 H48 M12 48 H36" stroke="#9dc2ff" stroke-width="4" stroke-linecap="round" transform="skewY(-8)" />
        </g>

